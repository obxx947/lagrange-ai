# ============================================================================
# Lagrange Tactical AI - Server Configuration
# Java-style properties file for server configuration
# ============================================================================

# ---- Server Identity ----
server.name=Lagrange-Tactical-AI
server.version=2.1.0
server.environment=development
server.region=cn-east

# ---- Network ----
server.host=127.0.0.1
server.port=8080
server.max.threads=16
server.connection.timeout=30000
server.max.request.size=16777216

# ---- SSL/TLS ----
server.ssl.enabled=false
server.ssl.port=8443
server.ssl.keystore.path=config/keystore.jks
server.ssl.keystore.password=changeit
server.ssl.key.alias=lagrange

# ---- Database ----
database.type=sqlite
database.path=data/lagrange.db
database.pool.size=5
database.pool.timeout=10000
database.pool.max.idle=3
database.pool.min.idle=1
database.vacuum.interval.hours=24

# ---- Redis Cache (optional) ----
cache.redis.enabled=false
cache.redis.host=127.0.0.1
cache.redis.port=6379
cache.redis.ttl.seconds=3600
cache.redis.max.connections=10

# ---- AI Engine ----
ai.model.path=models/tactical_v3.pt
ai.simulation.max.rounds=600
ai.simulation.tick.rate=20
ai.simulation.default.seed=42
ai.simulation.parallel.count=8
ai.recommendation.max.cv=500
ai.recommendation.fleet.size.min=3
ai.recommendation.fleet.size.max=12
ai.cache.enabled=true
ai.cache.ttl.seconds=3600

# ---- Logging ----
logging.level.root=INFO
logging.level.com.lagrange=DEBUG
logging.level.com.lagrange.ai=INFO
logging.file.enabled=true
logging.file.path=logs/server.log
logging.file.max.size=10MB
logging.file.max.history=30
logging.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- Health Checks ----
health.check.interval.seconds=30
health.check.http.timeout=10
health.check.disk.min.free.mb=500
health.check.memory.max.percent=85
health.check.response.max.ms=2000

# ---- Security ----
security.jwt.enabled=false
security.jwt.secret.env=LAGRANGE_JWT_SECRET
security.jwt.expiration.minutes=60
security.api.keys.enabled=false
security.rate.limit.enabled=true
security.rate.limit.rpm=120
security.rate.limit.burst=20
security.cors.enabled=true
security.cors.origins=http://localhost:3000,http://127.0.0.1:3000

# ---- Battle Reports ----
report.output.dir=reports/
report.template=templates/fleet_report.jinja
report.formats=html,json,pdf
report.ai.analysis.enabled=true
report.retention.days=90

# ---- Maintenance ----
maintenance.backup.enabled=true
maintenance.backup.interval.hours=24
maintenance.backup.location=backups/
maintenance.backup.keep.count=7
maintenance.cleanup.logs.retention.days=30
maintenance.cleanup.temp.retention.days=7
maintenance.cleanup.battles.retention.days=90

# ---- External Services ----
external.discord.webhook.url=
external.slack.webhook.url=
external.telemetry.enabled=false
external.update.check.enabled=false
