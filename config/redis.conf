# ============================================================
# Lagrange Tactical AI - Redis Configuration
# Cache and message broker for Lagrange fleet analysis platform
# ============================================================

# ---- Network ----
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# ---- Security ----
requirepass ${REDIS_PASSWORD}
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "LAGRANGE_CONFIG"
rename-command SHUTDOWN "LAGRANGE_SHUTDOWN"

# ---- General ----
daemonize no
supervised no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16
always-show-logo no
set-proc-title yes

# ---- Persistence (RDB) ----
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename lagrange_dump.rdb
dir /data

# ---- Persistence (AOF) ----
appendonly yes
appendfilename "lagrange_appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ---- Replication ----
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 10mb
repl-backlog-ttl 3600
min-replicas-to-write 1
min-replicas-max-lag 10

# ---- Client Limits ----
maxclients 10000
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10
replica-ignore-maxmemory yes

# ---- Lazy Freeing ----
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# ---- Slow Log ----
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- Latency Monitor ----
latency-monitor-threshold 100

# ---- Event Notification ----
notify-keyspace-events "Ex"

# ---- Advanced ----
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
jemalloc-bg-thread yes

# ---- Cluster (disabled for single instance) ----
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000

# ---- TLS (disabled for internal k8s) ----
# tls-port 6380
# tls-cert-file /certs/redis.crt
# tls-key-file /certs/redis.key
# tls-ca-cert-file /certs/ca.crt
