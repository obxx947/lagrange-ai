# ============================================================
# Lagrange Tactical AI - Kafka Properties
# Event streaming configuration for Lagrange fleet analysis
# ============================================================

# ---- Broker Configuration ----
bootstrap.servers=lagrange-kafka-broker-0:9092,lagrange-kafka-broker-1:9092,lagrange-kafka-broker-2:9092
client.id=lagrange-tactical-ai-producer
group.id=lagrange-tactical-ai-consumer-group

# ---- Security ----
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="lagrange-producer" password="${KAFKA_PASSWORD}";
ssl.truststore.location=/certs/kafka.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.endpoint.identification.algorithm=HTTPS

# ---- Producer Configuration ----
producer.type=sync
compression.type=snappy
batch.size=16384
linger.ms=5
buffer.memory=33554432
max.request.size=1048576
retries=3
retry.backoff.ms=200
request.timeout.ms=30000
acks=all
max.in.flight.requests.per.connection=1
enable.idempotence=true
transactional.id=lagrange-battle-engine-tx
transaction.timeout.ms=60000

# ---- Consumer Configuration ----
auto.offset.reset=earliest
enable.auto.commit=true
auto.commit.interval.ms=5000
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=3000
fetch.min.bytes=1
fetch.max.wait.ms=500
fetch.max.bytes=52428800
max.partition.fetch.bytes=1048576
isolation.level=read_committed

# ---- Topic Configuration ----
topic.battle.commands=lagrange.battle.commands
topic.battle.events=lagrange.battle.events
topic.battle.results=lagrange.battle.results
topic.fleet.updates=lagrange.fleet.updates
topic.ship.data=lagrange.ship.data
topic.ai.inference=lagrange.ai.inference
topic.rag.indexing=lagrange.rag.indexing
topic.analytics=lagrange.analytics
topic.dead.letter=lagrange.dead.letter

# ---- Topic Settings ----
num.partitions=6
replication.factor=3
min.insync.replicas=2
retention.ms=604800000
retention.bytes=10737418240
segment.bytes=1073741824
compression.type=producer
cleanup.policy=delete
delete.retention.ms=86400000

# ---- Performance ----
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
connections.max.idle.ms=540000
reconnect.backoff.ms=1000
reconnect.backoff.max.ms=10000
metrics.sample.window.ms=30000
metrics.num.samples=2
metrics.recording.level=INFO

# ---- Monitoring ----
metric.reporters=org.apache.kafka.common.metrics.JmxReporter
interceptor.classes=io.confluent.monitoring.clients.interceptor.MonitoringInterceptor
