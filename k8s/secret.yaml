apiVersion: v1
kind: Secret
metadata:
  name: lagrange-secrets
  namespace: lagrange
  labels:
    app: lagrange-agent
    component: secrets
    game: infinite-lagrange
type: Opaque
stringData:
  # IMPORTANT: In production, DO NOT commit real secrets here.
  # Use a secrets management solution:
  #   - Sealed Secrets (bitnami/sealed-secrets)
  #   - External Secrets Operator
  #   - HashiCorp Vault + Vault Secrets Operator
  #   - AWS Secrets Manager + CSI Driver
  #   - Azure Key Vault + CSI Driver

  # ---- DeepSeek AI API Key ----
  deepseek-api-key: "sk-your-production-api-key-here"

  # ---- Admin Authentication ----
  admin-password: "CHANGE_THIS_ADMIN_PASSWORD_TO_SECURE_VALUE"
  admin-api-key: "CHANGE_THIS_ADMIN_API_KEY"

  # ---- JWT Configuration ----
  jwt-secret: "CHANGE_THIS_JWT_SECRET_TO_RANDOM_64_CHARACTER_STRING_MINIMUM"

  # ---- Redis Cache ----
  redis-password: "CHANGE_THIS_REDIS_PASSWORD"

  # ---- Database ----
  database-url: "sqlite+aiosqlite:///app/data/lagrange.db"
  database-encryption-key: "CHANGE_THIS_DB_ENCRYPTION_KEY"

  # ---- Monitoring / Grafana ----
  grafana-admin-password: "CHANGE_GRAFANA_ADMIN_PASSWORD"

  # ---- External Integrations ----
  slack-webhook-url: "https://hooks.slack.com/services/CHANGE_ME"
  discord-webhook-url: "https://discord.com/api/webhooks/CHANGE_ME"
