# ============================================================
# Lagrange Tactical AI - Kubernetes Ingress
# External access with TLS termination and rate limiting
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lagrange-agent-ingress
  namespace: lagrange
  labels:
    app: lagrange-agent
    component: ingress
    game: infinite-lagrange
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rate: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lagrange.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Request-ID"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "X-XSS-Protection: 1; mode=block";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - lagrange.example.com
    - api.lagrange.example.com
    - ws.lagrange.example.com
    secretName: lagrange-tls
  rules:
  - host: lagrange.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lagrange-agent-svc
            port:
              number: 80
  - host: api.lagrange.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lagrange-agent-svc
            port:
              number: 80
  - host: ws.lagrange.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lagrange-agent-svc
            port:
              number: 8080
