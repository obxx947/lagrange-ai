# ============================================================
# 拉格朗日AI — CFG 配置文件
# 简单键值对格式
# ============================================================

# 服务器
server.host 0.0.0.0
server.port 3000
server.log_level info

# DeepSeek API
deepseek.model deepseek-chat
deepseek.temperature 0.3
deepseek.max_tokens 2048

# RAG 知识库
rag.chunk_size 500
rag.chunk_overlap 50
rag.retrieval_top_k 5
rag.max_features 5000

# 认证
auth.jwt_days 7
auth.bcrypt_rounds 12

# 限流
ratelimit.max_per_hour 10
ratelimit.window 3600

# 计费
billing.new_tokens 10000
billing.recharge_min 1
billing.recharge_max 1000000

# 数据库
db.path ./lagrange.db
db.backup_dir ./db_backup
db.session_cleanup_days 7
db.chat_cleanup_days 14

# 战斗引擎
battle.tuning_coeff 1.3
battle.min_damage_ratio 0.1
battle.base_crit_rate 0.15
battle.system_damage_chance 0.10
battle.max_sim_time 300
