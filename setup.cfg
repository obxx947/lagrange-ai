# ============================================================
# Lagrange Tactical AI - setup.cfg
# Static configuration for Python development tools
# ============================================================

[metadata]
name = lagrange-tactical-ai
version = attr: lagrange.__version__
description = Infinite Lagrange AI Tactical Analysis Center
long_description = file: README.rst, README.md
long_description_content_type = text/x-rst; charset=UTF-8
author = Lagrange AI Community
author_email = dev@lagrange-ai.dev
maintainer = Core Engineering Team
maintainer_email = core@lagrange-ai.dev
license = MIT
license_files = LICENSE
url = https://github.com/lagrange-ai/tactical-center
project_urls =
    Documentation = https://docs.lagrange-ai.dev
    Source = https://github.com/lagrange-ai/tactical-center
    Tracker = https://github.com/lagrange-ai/tactical-center/issues
    Discord = https://discord.gg/lagrange-ai
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Environment :: Web Environment
    Framework :: FastAPI
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: MIT License
    Natural Language :: Chinese (Simplified)
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Games/Entertainment :: Simulation
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
python_requires = >=3.10, <3.13
package_dir =
    = src
packages = find:
include_package_data = True
zip_safe = False
install_requires =
    fastapi>=0.110.0
    uvicorn[standard]>=0.27.0
    pydantic>=2.5.0
    pydantic-settings>=2.1.0
    sqlalchemy>=2.0.0
    aiosqlite>=0.19.0
    python-jose[cryptography]>=3.3.0
    passlib[bcrypt]>=1.7.4
    python-multipart>=0.0.6
    httpx>=0.25.0
    openai>=1.6.0
    numpy>=1.24.0
    scikit-learn>=1.3.0
    faiss-cpu>=1.7.4
    chromadb>=0.4.0
    jieba>=0.42.1

[options.packages.find]
where = src
include = lagrange, lagrange.*
exclude = tests, tests.*

[options.package_data]
lagrange =
    data/*.json
    data/*.csv
    data/ships/*.json
    templates/*.html
    templates/*.jinja2
    static/**/*

[options.extras_require]
dev =
    pytest>=8.0.0
    pytest-asyncio>=0.23.0
    pytest-cov>=4.1.0
    black>=24.0.0
    isort>=5.13.0
    ruff>=0.1.0
    mypy>=1.8.0
    pre-commit>=3.6.0
    coverage>=7.4.0
    ipython>=8.18.0
gpu =
    faiss-gpu>=1.7.4
    torch>=2.1.0
    onnxruntime-gpu>=1.16.0
docs =
    sphinx>=7.2.0
    sphinx-rtd-theme>=2.0.0
    myst-parser>=2.0.0
monitoring =
    prometheus-fastapi-instrumentator>=6.0.0
    opentelemetry-api>=1.21.0
    opentelemetry-sdk>=1.21.0

[options.entry_points]
console_scripts =
    lagrange-server = lagrange.main:run_server
    lagrange-cli = lagrange.cli:main
    lagrange-import = lagrange.data_import:main
    lagrange-export = lagrange.export:main
    lagrange-backup = lagrange.admin:backup_command

# ---- Tool configurations ----

[flake8]
max-line-length = 100
max-complexity = 15
statistics = True
count = True
show-source = True
format = pylint
exclude =
    .git,
    __pycache__,
    node_modules,
    chroma_db,
    db_backup,
    exports,
    .venv,
    venv,
    build,
    dist,
    eggs,
    .tox,
    .eggs,
ignore =
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    E501,  # line too long (handled by black)
    F811,  # redefinition of unused
    F403,  # star imports
per-file-ignores =
    __init__.py:F401,F403
    tests/*:D100,D101,D102,D103
    conftest.py:D100

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = false
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = lagrange
known_third_party = fastapi,pydantic,sqlalchemy,numpy,faiss,chromadb
skip = .git,__pycache__,node_modules,.venv,build,dist
skip_glob = */migrations/*

[mypy]
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
plugins =
    pydantic.mypy
    sqlalchemy.ext.mypy.plugin
exclude =
    tests/
    build/
    dist/
    .venv/

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[coverage:run]
source = lagrange
branch = true
parallel = true
concurrency = multiprocessing,thread
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
    if TYPE_CHECKING:
show_missing = true
skip_covered = false
sort = cover
precision = 2
fail_under = 75

[coverage:html]
directory = htmlcov
title = Lagrange AI Coverage Report

[pycodestyle]
max-line-length = 100
statistics = True
count = True
format = pylint

[pydocstyle]
convention = numpy
add-ignore = D100,D104,D107,D203,D212,D213,D402,D413,D415,D416,D417
add-select = D200,D201,D202,D204,D205,D206,D207,D208,D209,D210,D211

[tool:pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=lagrange
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gpu: marks tests that require GPU
    api: marks tests that target API endpoints
    battle: marks tests related to battle engine
    fleet: marks tests related to fleet optimization
    rag: marks tests related to RAG retrieval

[aliases]
test = pytest
