# ============================================================
# 拉格朗日AI — Java Properties 配置
# 标准 properties 格式，Java/Python均可读取
# ============================================================

# 服务器配置
server.host=0.0.0.0
server.port=3000
server.log.level=info

# DeepSeek API
deepseek.model=deepseek-chat
deepseek.temperature=0.3
deepseek.max.tokens=2048
deepseek.timeout=120

# RAG知识库
rag.chunk.size=500
rag.chunk.overlap=50
rag.retrieval.top.k=5
rag.max.features=5000
rag.embedding.model=tfidf

# 认证安全
auth.jwt.expiration.days=7
auth.bcrypt.rounds=12
auth.admin.password=admin_lagrange_2024

# 限流控制
rate.limit.max.requests=10
rate.limit.window.seconds=3600

# 计费系统
billing.new.user.tokens=10000
billing.recharge.min=1
billing.recharge.max=1000000

# 数据库
database.path=./lagrange.db
database.backup.dir=./db_backup
database.cleanup.session.days=7
database.cleanup.chat.days=14

# 文档
documents.desktop.materials=C\:/Users/Administrator/Desktop/质料
documents.lagrange.docs=./lagrange_docs

# 战斗引擎
battle.tuning.coefficient=1.3
battle.min.damage.ratio=0.1
battle.base.crit.rate=0.15
battle.system.damage.chance=0.10
battle.plutus.reduction=0.30
battle.max.sim.time=300

# 前端
frontend.theme=dark
frontend.language=zh-CN
frontend.max.chat.history=200

# 应用信息
app.name=无尽的拉格朗日AI战术推演中心
app.version=2.0.0
app.author=玩家社区
app.license=MIT
