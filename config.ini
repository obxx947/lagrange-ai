; ============================================================
; 拉格朗日AI — INI 配置文件
; Windows 传统配置格式，兼容性好
; ============================================================

[Server]
Host=0.0.0.0
Port=3000
Workers=1
LogLevel=info

[DeepSeek]
Model=deepseek-chat
Temperature=0.3
MaxTokens=2048
Timeout=120
; APIKey 从 .env 文件读取

[RAG]
ChunkSize=500
ChunkOverlap=50
RetrievalTopK=5
MaxFeatures=5000
EmbeddingModel=tfidf

[Auth]
JWTExpirationDays=7
BcryptRounds=12
AdminPassword=admin_lagrange_2024

[RateLimit]
MaxRequests=10
WindowSeconds=3600

[Billing]
NewUserTokens=10000
RechargeMin=1
RechargeMax=1000000

[Database]
Path=./lagrange.db
BackupDir=./db_backup
SessionCleanupDays=7
ChatCleanupDays=14

[Documents]
DesktopMaterials=C:/Users/Administrator/Desktop/质料
LagrangeDocs=./lagrange_docs

[Battle]
TuningCoefficient=1.3
MinDamageRatio=0.1
BaseCritRate=0.15
SystemDamageChance=0.10
PlutusReduction=0.30
MaxSimTime=300

[Frontend]
Theme=dark
Language=zh-CN
MaxChatHistory=200
