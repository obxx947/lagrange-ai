[package]
name = "battle-engine-rs"
version = "0.1.0"
edition = "2021"
description = "高性能拉格朗日战斗模拟引擎 - Rust实现"
authors = ["Lagrange AI Team"]
license = "MIT"
repository = "https://github.com/user/lagrange-agent"
keywords = ["game", "simulation", "battle", "infinite-lagrange", "combat"]
categories = ["games", "simulation", "science"]

[lib]
name = "battle_engine_rs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[[bench]]
name = "battle_benchmark"
harness = false

# PyO3 configuration
[package.metadata.maturin]
name = "battle_engine_rs"
bindings = "pyo3"
python-source = "."
